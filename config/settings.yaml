# Global runtime settings for trendpress. Edit freely; all keys have defaults
# baked into the code, but keeping them here documents the knobs explicitly.

geo: "GB"                              # Google Trends region (ISO country code)
# Pinned, stable model ids (NOT *-latest aliases). Env GEMINI_MODEL /
# GEMINI_FALLBACK_MODEL override these. Fallback is used when 503 overload persists.
gemini_model: "gemini-2.5-flash"
gemini_fallback_model: "gemini-2.5-flash-lite"   # used after 2 consecutive 503s on the primary

# Pacing / quotas — min seconds between Gemini calls (env GEMINI_MIN_SECONDS_BETWEEN_CALLS overrides)
sleep_between_calls_seconds: 10

# Topic -> site matching
max_sites_per_topic: 3                  # a trend may run on up to this many sites (each gets a local angle)
min_match_score: 5                      # 0-10 relevance threshold (lower = more trends qualify -> more sites filled)
dedupe_window_days: 7                   # don't reuse a trend within this many days

# Editorial review gate before publishing
review_mode: "live"                     # live | pending | sample | auto
                                        #   live    = publish immediately (public)
                                        #   pending = draft awaiting human approval
                                        #   sample  = sample_rate pending, rest scheduled
                                        #   auto    = all scheduled in the publish window
sample_rate: 0.1                        # fraction held as pending when review_mode = sample

# When publishing is allowed (local site time)
publish_window:
  start: "09:00"
  end: "18:00"
  timezone: "Europe/London"

# Per-site output ceiling fallback (used when a site omits posts_per_day_cap)
posts_per_day_cap_default: 2

# --------------------------------------------------------------------------- #
# Housekeeping — auto-delete dead posts (python main.py --prune)
# --------------------------------------------------------------------------- #
# A post is "dead" when it has been live for min_age_days and earned no more
# than max_clicks / max_impressions in Search Console over metrics_window_days.
# Deletion is permanent on WordPress (force=true), so the row and the featured
# image leave wp_posts and wp-content/uploads rather than sitting in the trash.
prune:
  enabled: true
  min_age_days: 60                    # only touch posts at least this old
  max_clicks: 0                       # 0 clicks = nobody read it
  max_impressions: 2                  # <=2 impressions = not ranking at all
  metrics_window_days: 28             # Search Console trailing window
  max_deletes_per_site_per_week: 10   # SAFETY CAP — bounds a wrong threshold
  require_fresh_metrics_days: 7       # refuse to prune on metrics older than this
  delete_media: true                  # also delete the featured image (reclaims disk)
